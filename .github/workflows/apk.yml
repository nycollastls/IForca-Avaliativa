name: APK Android


# Roda quando o app muda ou quando alguém pede pela aba Actions
on:

  push:
    branches: [main]
    paths:
      - assets/**
      - lib/**
      - android/**
      - pubspec.lock
      - pubspec.yaml
      - .github/workflows/apk.yml

  workflow_dispatch:


jobs:

  compilar_apk:

    runs-on: ubuntu-latest

    steps:

      # Baixa o código do repositório
      - uses: actions/checkout@v5

      # Instala o Java que o Gradle precisa
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Instala a mesma versão do Flutter usada no projeto
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      # Compila o APK apontando para o servidor do Render
      - run: flutter pub get
      # Tenta até 3 vezes, porque o repositório de pacotes às vezes recusa por excesso de pedidos
      - run: |
          set -o pipefail
          for tentativa in 1 2 3; do
            flutter build apk --release --dart-define=ENDERECO_SERVIDOR=https://iforca-servidor.onrender.com 2>&1 | tee compilacao.log && exit 0
            sleep 90
          done
          exit 1

      # Se falhar, mostra o fim do log como anotação para facilitar a leitura
      - if: failure()
        run: |
          trecho=$(tail -n 60 compilacao.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Falha ao compilar o APK::$trecho"

      # Deixa o APK disponível para baixar na execução
      - uses: actions/upload-artifact@v4
        with:
          name: forca-da-programacao-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
